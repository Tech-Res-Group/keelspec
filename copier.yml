# Copier template: scaffold a product-as-code repo wired to KeelSpec in one command.
#
#   pipx run copier copy --trust gh:tarvitave/keelspec my-product-repo
#
# `--trust` lets the post-scaffold task run `keelspec build`, so the new repo starts
# with a committed, in-sync bundle that its CI gate accepts on the first push. Without
# it, run `pip install keelspec && keelspec build` yourself before the first commit.
_min_copier_version: "9.0.0"
_subdirectory: "template"      # the library lives at the repo root; the template is here

project_name:
  type: str
  help: "Human name of your product (shown in the scaffolded README)."
  default: "My Product"

product_dir:
  type: str
  help: "Directory that holds your product/ artifacts."
  default: "product"

output_bundle:
  type: str
  help: "Path for the generated render bundle (kept in sync by the CI gate)."
  default: "build/product.generated.json"

keelspec_version:
  type: str
  help: "KeelSpec version to pin in CI and install for the post-scaffold build."
  default: "0.7.0"

_tasks:
  # Make the freshly scaffolded repo immediately valid. Skipped unless you pass --trust.
  - "python -m pip install --quiet 'keelspec=={{ keelspec_version }}' || pip install --quiet 'keelspec=={{ keelspec_version }}'"
  - "keelspec -p product_hooks.py build"
