# keelspec.com — the site API. No Caddy here.
#
# :80/:443 belong to the shared edge at /opt/edge, which serves this site from a
# snippet in its conf.d/ and reads ./public read-only. That split exists because
# one app's deploy used to be able to take the other's site off the internet by
# rewriting the file that routed it.
#
#   docker compose up -d --build
#
# This service publishes no port. It is reachable only from the `edge` network,
# which is what keeps :8000 off the public internet.

networks:
  edge:
    external: true
    name: edge

# keelspec.com
#
#   docker compose up -d      site, lead capture, admin panel  (~250 MB RAM)
#
# Analytics is first-party and lives in the API (see /admin/analytics), so there is
# no separate analytics service to run.
#
# This service publishes no port. The shared edge reaches it over the `edge`
# network, which is what keeps :8000 off the public internet.

services:
  api:
    build: ./api
    # The edge's conf.d snippet proxies to this name; a compose service name
    # only resolves inside its own project, and the edge is a different one.
    container_name: keelspec-api
    networks: [edge]
    restart: unless-stopped
    # Runs as the host owner of ./public so the SEO job and the newsletter archive
    # can write there. The image's own uid cannot: a bind mount keeps host ownership.
    user: "1000:1000"
    environment:
      LEADS_DB: /data/leads.db
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      IP_SALT: ${IP_SALT:?set IP_SALT in .env}
      # admin panel
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # newsletter -- NEWSLETTER_AUTOSEND is the kill switch for unattended sending
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      NEWSLETTER_FROM: ${NEWSLETTER_FROM:-marketing@keelspec.com}
      NEWSLETTER_AUTOSEND: ${NEWSLETTER_AUTOSEND:-off}
      NEWSLETTER_MAX_RECIPIENTS: ${NEWSLETTER_MAX_RECIPIENTS:-2000}
      # seo
      SEO_AUTOFIX: ${SEO_AUTOFIX:-on}
      PUBLIC_DIR: /srv/public
      BLOG_BUNDLE: /srv/content/build/blog.generated.json
    # A wedged process still holds the port, so restart:unless-stopped alone does
    # not help. This makes Docker notice and replace it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - api_data:/data
      # writable: the SEO job applies safe fixes and the newsletter writes its archive
      - ./public:/srv/public
      - ./content:/srv/content:ro
    expose:
      - "8000"


volumes:
  api_data:
