name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check keelspec tests scripts
      - name: Secret scan
        run: python scripts/check_no_secrets.py

      - name: Unit tests with a coverage floor
        run: |
          pip install coverage
          coverage run -m pytest -q
          coverage report
      - name: Site structure gate
        run: python site/tools/check_site.py

      - name: Dogfood — the blog must validate as product-as-code
        run: |
          cd site/content
          keelspec build
          git diff --exit-code build/             || { echo "::error::blog bundle is stale — run keelspec build"; exit 1; }
          keelspec validate

      - name: Dogfood — the quickstart example must validate
        run: |
          keelspec -C examples/quickstart build
          git diff --exit-code examples/quickstart/build/ \
            || { echo "::error::quickstart bundle is stale — run keelspec build"; exit 1; }
          keelspec -C examples/quickstart validate

      # Not a demonstration like the two above. This is where the engine's own
      # decisions, constraints and rules are written down, and it is gated for
      # the same reason a consumer's tree is: a rule nothing checks is a rule
      # that has already drifted.
      - name: The engine's own intent must validate
        run: |
          keelspec build
          git diff --exit-code build/ \
            || { echo "::error::product bundle is stale — run keelspec build"; exit 1; }
          keelspec validate

      # Asks a different version of the library the same question, which is the
      # only way self-hosting can notice a break: a schema change and the tree
      # that satisfies it land in the same commit, so this repository's gate
      # always agrees with this repository's engine. One Python is enough — the
      # answer cannot differ by interpreter, and this is the one step that talks
      # to the network.
      - name: Released codes still mean what they meant
        if: matrix.python == '3.12'
        run: python scripts/check_code_stability.py
